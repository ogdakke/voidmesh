    &lt;main class="report-content"&gt;
      &lt;header id="executive-summary"&gt;
        &lt;div class="eyebrow"&gt;Voidmesh · trace review · 14 July 2026&lt;/div&gt;
        &lt;h1 id="vm-report-title"&gt;262k-entity canvas performance&lt;/h1&gt;
        &lt;p class="lede"&gt;The traces showed selection and debug ejecting a highly batchable scene onto a per-visible-entity CPU path. That architectural break is now fixed: the 262,144-entity WebGPU matrix keeps one persistent instance payload for no selection, one selected entity, half selection, all selection, and half selection with debug.&lt;/p&gt;

        &lt;div class="stat-grid" aria-label="Top findings"&gt;
          &lt;div class="stat"&gt;&lt;div class="muted"&gt;Candidate CPU render p95&lt;/div&gt;&lt;div class="stat-value good"&gt;0.2–0.3 ms&lt;/div&gt;&lt;div class="muted"&gt;all five selection/debug variants&lt;/div&gt;&lt;/div&gt;
          &lt;div class="stat"&gt;&lt;div class="muted"&gt;Batch rebuilds&lt;/div&gt;&lt;div class="stat-value good"&gt;1&lt;/div&gt;&lt;div class="muted"&gt;per complete scenario, never per pan frame&lt;/div&gt;&lt;/div&gt;
          &lt;div class="stat"&gt;&lt;div class="muted"&gt;Normal instance uploads&lt;/div&gt;&lt;div class="stat-value good"&gt;0 B&lt;/div&gt;&lt;div class="muted"&gt;8 MiB full-scene payload uploaded once&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/header&gt;

      &lt;section id="trace-evidence"&gt;
        &lt;h2&gt;What the three traces say&lt;/h2&gt;
        &lt;p&gt;The captures are observational rather than controlled A/B runs: recording lengths and interaction counts differ. The large separation is still decisive, and the call stacks line up with the renderer’s explicit batch-admission rules.&lt;/p&gt;

        &lt;div class="trace-grid"&gt;
          &lt;article class="trace-card"&gt;&lt;strong&gt;Half selected · debug off&lt;/strong&gt;&lt;dl&gt;&lt;dt&gt;Recorded span&lt;/dt&gt;&lt;dd&gt;7.87 s&lt;/dd&gt;&lt;dt&gt;Dropped frames&lt;/dt&gt;&lt;dd&gt;53.0%&lt;/dd&gt;&lt;dt&gt;Slow interaction frames&lt;/dt&gt;&lt;dd&gt;28&lt;/dd&gt;&lt;dt&gt;Median slow frame&lt;/dt&gt;&lt;dd&gt;156.0 ms&lt;/dd&gt;&lt;dt&gt;GPU task p95&lt;/dt&gt;&lt;dd&gt;0.369 ms&lt;/dd&gt;&lt;dt&gt;JS heap range&lt;/dt&gt;&lt;dd&gt;615–659 MB&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
          &lt;article class="trace-card"&gt;&lt;strong&gt;Half selected · debug on&lt;/strong&gt;&lt;dl&gt;&lt;dt&gt;Recorded span&lt;/dt&gt;&lt;dd&gt;11.74 s&lt;/dd&gt;&lt;dt&gt;Dropped frames&lt;/dt&gt;&lt;dd&gt;46.1%&lt;/dd&gt;&lt;dt&gt;Slow interaction frames&lt;/dt&gt;&lt;dd&gt;44&lt;/dd&gt;&lt;dt&gt;Median slow frame&lt;/dt&gt;&lt;dd&gt;107.7 ms&lt;/dd&gt;&lt;dt&gt;GPU task p95&lt;/dt&gt;&lt;dd&gt;0.380 ms&lt;/dd&gt;&lt;dt&gt;JS heap range&lt;/dt&gt;&lt;dd&gt;613–652 MB&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
          &lt;article class="trace-card"&gt;&lt;strong&gt;No selection · debug off&lt;/strong&gt;&lt;dl&gt;&lt;dt&gt;Recorded span&lt;/dt&gt;&lt;dd&gt;8.81 s&lt;/dd&gt;&lt;dt&gt;Dropped frames&lt;/dt&gt;&lt;dd&gt;1.8%&lt;/dd&gt;&lt;dt&gt;Normal RAF p95&lt;/dt&gt;&lt;dd&gt;0.310 ms&lt;/dd&gt;&lt;dt&gt;GPU task p95&lt;/dt&gt;&lt;dd&gt;0.466 ms&lt;/dd&gt;&lt;dt&gt;JS heap range&lt;/dt&gt;&lt;dd&gt;607–612 MB&lt;/dd&gt;&lt;dt&gt;Batch prep sample&lt;/dt&gt;&lt;dd&gt;1.6 ms&lt;/dd&gt;&lt;/dl&gt;&lt;/article&gt;
        &lt;/div&gt;

        &lt;div class="chart" role="img" aria-label="Slow interaction callback duration compared with the 16.7 millisecond frame budget. No selection p95 is 0.31 milliseconds, selected median is 156 milliseconds, selected plus debug median is 107.7 milliseconds."&gt;
          &lt;h3&gt;Main-thread animation callback cost&lt;/h3&gt;
          &lt;div class="budget-axis"&gt;&lt;span&gt;&lt;/span&gt;&lt;div class="axis-line"&gt;&lt;/div&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class="bar-row"&gt;&lt;span&gt;No selection · p95&lt;/span&gt;&lt;div class="bar-track"&gt;&lt;div class="bar" style="width:0.2%"&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class="bar-value"&gt;0.31 ms&lt;/span&gt;&lt;/div&gt;
          &lt;div class="bar-row"&gt;&lt;span&gt;Half selected · active median&lt;/span&gt;&lt;div class="bar-track"&gt;&lt;div class="bar hot" style="width:100%"&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class="bar-value"&gt;156.0 ms&lt;/span&gt;&lt;/div&gt;
          &lt;div class="bar-row"&gt;&lt;span&gt;Selected + debug · active median&lt;/span&gt;&lt;div class="bar-track"&gt;&lt;div class="bar warn" style="width:69%"&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class="bar-value"&gt;107.7 ms&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;p class="muted"&gt;The 710 ms outlier in the no-selection capture is DevTools starting the CPU profiler, not Voidmesh work; it is excluded from the normal-frame comparison.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section id="root-cause"&gt;
        &lt;h2&gt;Primary root cause: selection ejected the overview batch&lt;/h2&gt;
        &lt;div class="finding" data-priority="p0"&gt;&lt;span class="tag"&gt;Fixed&lt;/span&gt;&lt;strong&gt;Selection and debug were hard batch disqualifiers.&lt;/strong&gt; Both flags now live in the versioned full-scene instance payload, keyed by &lt;code&gt;selectionVersion&lt;/code&gt; with entity and geometry versions.&lt;/div&gt;

        &lt;div class="pipeline" aria-label="Former slow pipeline"&gt;
          &lt;div class="pipeline-step"&gt;&lt;strong&gt;Spatial query&lt;/strong&gt;&lt;br&gt;&lt;span class="muted"&gt;collect + z-sort visible entities&lt;/span&gt;&lt;/div&gt;
          &lt;div class="pipeline-step"&gt;&lt;strong&gt;Texture lookup&lt;/strong&gt;&lt;br&gt;&lt;span class="muted"&gt;per visible entity&lt;/span&gt;&lt;/div&gt;
          &lt;div class="pipeline-step"&gt;&lt;strong&gt;Draw-item prep&lt;/strong&gt;&lt;br&gt;&lt;span class="muted"&gt;selection + cache state&lt;/span&gt;&lt;/div&gt;
          &lt;div class="pipeline-step"&gt;&lt;strong&gt;Instance rewrite&lt;/strong&gt;&lt;br&gt;&lt;span class="muted"&gt;CPU buffer every frame&lt;/span&gt;&lt;/div&gt;
          &lt;div class="pipeline-step"&gt;&lt;strong&gt;GPU upload&lt;/strong&gt;&lt;br&gt;&lt;span class="muted"&gt;then one/few cheap draws&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;div class="chart" role="img" aria-label="Selected trace non-idle sampled CPU hot functions. Texture reuse lookup 29.1 percent, draw item prepare 21.6 percent, spatial query and append 15.7 percent, draw command preparation 8.8 percent, other 25 percent."&gt;
          &lt;h3&gt;Half-selected trace · share of non-idle sampled CPU&lt;/h3&gt;
          &lt;div class="bar-row"&gt;&lt;span&gt;Texture reuse lookup&lt;/span&gt;&lt;div class="bar-track"&gt;&lt;div class="bar hot" style="width:100%"&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class="bar-value"&gt;29.1%&lt;/span&gt;&lt;/div&gt;
          &lt;div class="bar-row"&gt;&lt;span&gt;Draw-item prepare&lt;/span&gt;&lt;div class="bar-track"&gt;&lt;div class="bar hot" style="width:74%"&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class="bar-value"&gt;21.6%&lt;/span&gt;&lt;/div&gt;
          &lt;div class="bar-row"&gt;&lt;span&gt;Spatial query + append&lt;/span&gt;&lt;div class="bar-track"&gt;&lt;div class="bar warn" style="width:54%"&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class="bar-value"&gt;15.7%&lt;/span&gt;&lt;/div&gt;
          &lt;div class="bar-row"&gt;&lt;span&gt;Draw commands&lt;/span&gt;&lt;div class="bar-track"&gt;&lt;div class="bar warn" style="width:30%"&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class="bar-value"&gt;8.8%&lt;/span&gt;&lt;/div&gt;
          &lt;div class="bar-row"&gt;&lt;span&gt;Other active CPU&lt;/span&gt;&lt;div class="bar-track"&gt;&lt;div class="bar" style="width:86%"&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class="bar-value"&gt;24.8%&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;p&gt;The workspace is ideal for persistent instancing: 131,072 static image entities, one immutable media asset, one dithering configuration, zoom 0.01. After duplication it becomes 262,144 instances while preserving the same shared source/effect identity. The no-selection trace confirms that the existing single-draw architecture handles this well.&lt;/p&gt;

        &lt;div class="finding"&gt;&lt;span class="tag"&gt;Implemented&lt;/span&gt;&lt;strong&gt;The base overview batch now carries selected/debug bits directly.&lt;/strong&gt; Pan-only frames update viewport uniforms without a spatial query, entity preparation, or instance upload. One selected entity splits the instanced draw at its z-order boundary so its label remains correctly layered; multi-selection borders stay shader-rendered in the single batch.&lt;/div&gt;
      &lt;/section&gt;

      &lt;section id="duplication-undo"&gt;
        &lt;h2&gt;Duplicate and undo: super-linear paths removed&lt;/h2&gt;
        &lt;p&gt;The reported lock-up is explained directly by the implementation even though the supplied traces focus on post-duplication navigation.&lt;/p&gt;

        &lt;div class="finding" data-priority="p0"&gt;&lt;span class="tag"&gt;Fixed&lt;/span&gt;&lt;strong&gt;Undo is one command and one bulk store mutation.&lt;/strong&gt; Renderer texture ownership is released in a bounded loop, then &lt;code&gt;removeEntities()&lt;/code&gt; filters IDs and selection once and publishes exactly one notification.&lt;/div&gt;

        &lt;div class="finding" data-priority="p0"&gt;&lt;span class="tag"&gt;Fixed&lt;/span&gt;&lt;strong&gt;Name allocation now keeps a monotonic next-suffix cursor per base name.&lt;/strong&gt; Repeated names no longer restart at suffix 1 for every clone.&lt;/div&gt;

        &lt;div class="finding"&gt;&lt;span class="tag"&gt;Fixed&lt;/span&gt;&lt;strong&gt;Shared images clone synchronously.&lt;/strong&gt; The duplicate path retains their immutable assets without creating 131k promises or settled-result records. Video, GIF, and SVG media retain the exception-safe asynchronous staging path.&lt;/div&gt;

        &lt;h3&gt;Target command shape&lt;/h3&gt;
        &lt;pre&gt;&lt;code&gt;Command.create({
  undo:    () =&amp;gt; { renderer.removeEntityTextures(newIds); store.removeEntities(newIdSet); },
  execute: () =&amp;gt; store.addEntities(duplicateBatch),
  onEvict: () =&amp;gt; cleanupDuplicateBatch(duplicateBatch, ownershipTokens)
})&lt;/code&gt;&lt;/pre&gt;
        &lt;p&gt;Preparation can yield cooperatively in bounded chunks, but the visible store mutation should remain one atomic &lt;code&gt;addEntities&lt;/code&gt; call and one selection replacement. This preserves the project’s bulk-mutation and undo invariants.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section id="debug-mode"&gt;
        &lt;h2&gt;Debug mode no longer de-optimizes composition&lt;/h2&gt;
        &lt;p&gt;The graph and text overlay are small: &lt;code&gt;#updateText&lt;/code&gt; accounts for about 8.3 ms total across the 11.74 s debug capture, and GPU task p95 remains 0.38 ms. The dominant side effect is architectural: &lt;code&gt;debugMode&lt;/code&gt; is another hard disqualifier for the overview batch.&lt;/p&gt;
        &lt;div class="finding"&gt;&lt;span class="tag"&gt;Implemented&lt;/span&gt;&lt;strong&gt;Debug is encoded as an instance flag and no longer rejects batching.&lt;/strong&gt; The graph/text overlay remains throttled. The half-selected debug benchmark matches the no-selection CPU render p95 at 0.2 ms.&lt;/div&gt;
      &lt;/section&gt;

      &lt;section id="implementation-plan"&gt;
        &lt;h2&gt;Implemented changes&lt;/h2&gt;
        &lt;div class="plan-grid"&gt;
          &lt;article class="plan-card"&gt;&lt;div class="priority"&gt;Complete · P0&lt;/div&gt;&lt;h3&gt;Batch duplicate + undo&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;One command for the whole duplicate set.&lt;/li&gt;&lt;li&gt;One add/remove store mutation.&lt;/li&gt;&lt;li&gt;Linear name allocation.&lt;/li&gt;&lt;li&gt;Synchronous shared-image retain path.&lt;/li&gt;&lt;li&gt;Batch renderer texture unbinding API.&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;
          &lt;article class="plan-card"&gt;&lt;div class="priority"&gt;Complete · P0&lt;/div&gt;&lt;h3&gt;Selection-aware overview&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Selection stays in the persistent batch.&lt;/li&gt;&lt;li&gt;Payload keyed by selection version.&lt;/li&gt;&lt;li&gt;Selected/debug bits written once.&lt;/li&gt;&lt;li&gt;Single-entity label preserves z order.&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

&lt;script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
&lt;/script&gt;
